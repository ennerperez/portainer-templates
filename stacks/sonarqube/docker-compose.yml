name: sonarqube
services:
  sonarqube:
    container_name: sonarqube
    image: sonarqube:community
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SONAR_JDBC_USERNAME: ${DB_USERNAME}
      SONAR_JDBC_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /usr/local/containers/volumes/services/sonarqube/data:/opt/SonarQube/data
      - /usr/local/containers/volumes/services/sonarqube/extensions:/opt/SonarQube/extensions
      - /usr/local/containers/volumes/services/sonarqube/logs:/opt/SonarQube/logs
    ports:
      - 9001:9000
    networks:
      - default
      - shared
  db:
    container_name: db
    image: postgres:12
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /usr/local/containers/volumes/services/sonarqube/db:/var/lib/postgresql/data
    networks:
      - default
      - shared
networks:
  shared:
    external: true
